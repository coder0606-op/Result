<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Academic Excellence School - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary-container": "#dce2f3",
                        "background": "#f8f9fa",

                        "on-tertiary-fixed-variant": "#005236",
                        "surface-variant": "#e1e3e4",
                        "on-error-container": "#93000a",
                        "primary-container": "#1a56db",
                        "surface-dim": "#d9dadb",
                        "secondary-fixed": "#dce2f3",
                        "on-tertiary-fixed": "#002113",
                        "surface-container-highest": "#e1e3e4",
                        "secondary-fixed-dim": "#c0c7d6",
                        "surface-container-high": "#e7e8e9",

                        "inverse-primary": "#b5c4ff",
                        "tertiary-container": "#006f4b",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c3c5d7",
                        "surface-container": "#edeeef",
                        "on-background": "#191c1d",

                        "inverse-on-surface": "#f0f1f2",
                        "outline": "#737686",
                        "tertiary": "#005438",
                        "surface-tint": "#1353d8",
                        "tertiary-fixed": "#81f9c1",

                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2e3132"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",

                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "32px",

                        "stack-lg": "48px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Work Sans"],

<style>
        .input-halo:focus-within {
            box-shadow: 0 0 0 2px rgba(26, 86, 219, 0.2);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Header / Brand Anchor -->
<header class="mb-stack-lg flex flex-col items-center text-center">
<img alt="Academic Excellence School Logo" class="h-24 w-24 object-contain mb-stack-sm rounded-DEFAULT" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhKW-xGZGHL6Amo1_kyuZoep8nAv7Qncyp80U5LgD1u-r_Y0Lq1Zzq7bLZPWSx2dRxXt5ozO2ITtQD3WaDbmqEaNbctGel8OAPKoU0laDYtvFc_7el-khn-V-uDuUXaEDGc-TA7javvcc7m7nKMsNZQNmHM7Xpd4DNddipsXgDeYN8_b_xV-jojoHxnVfQgBxXLYSevXT-aKz0BpqikGLocx_IwwluV3dxU5kHNksUimAksT30hDoc"/>
<h1 class="font-display-lg text-display-lg text-primary">Academic Excellence</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">Secure Portal Access</p>
</header>
<!-- Login Container (Bento/Split Grid) -->
<div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Student Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-surface-variant p-margin-desktop shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col relative overflow-hidden group">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-secondary-container"></div>
<div class="flex items-center mb-stack-md">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center mr-4">
<span class="material-symbols-outlined text-secondary font-bold" data-icon="school" data-weight="fill" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Student Portal</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Access grades, assignments, and schedule</p>
</div>
</div>
<form class="flex-grow flex flex-col gap-stack-sm">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="studentId">Student ID</label>
<div class="relative input-halo rounded-lg transition-shadow duration-200">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="badge">badge</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-0 text-body-md text-on-surface placeholder-on-surface-variant/50 transition-colors" id="studentId" name="studentId" placeholder="e.g. STU-12345" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="rollNumber">Roll Number</label>
<div class="relative input-halo rounded-lg transition-shadow duration-200">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="numbers">numbers</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-0 text-body-md text-on-surface placeholder-on-surface-variant/50 transition-colors" id="rollNumber" name="rollNumber" placeholder="Enter your assigned roll number" required="" type="text"/>
</div>
</div>
<div class="mt-auto pt-stack-sm">
<button class="w-full py-3 px-6 bg-secondary-container text-on-secondary-container font-label-md text-label-md rounded-lg hover:bg-secondary-fixed-dim transition-colors duration-200 flex items-center justify-center gap-2" type="button">
<span>Login as Student</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Teacher/Admin Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-surface-variant p-margin-desktop shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col relative overflow-hidden group">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="flex items-center mb-stack-md">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mr-4">
<span class="material-symbols-outlined text-primary font-bold" data-icon="shield_person" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Staff &amp; Admin</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Faculty dashboard and management tools</p>
</div>
</div>
<form class="flex-grow flex flex-col gap-stack-sm">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative input-halo rounded-lg transition-shadow duration-200">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-0 text-body-md text-on-surface placeholder-on-surface-variant/50 transition-colors" id="email" name="email" placeholder="faculty@academicexcellence.edu" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative input-halo rounded-lg transition-shadow duration-200">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-0 text-body-md text-on-surface placeholder-on-surface-variant/50 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="mt-auto pt-stack-sm">
<button class="w-full py-3 px-6 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container transition-colors duration-200 flex items-center justify-center gap-2 shadow-sm" type="button">
<span>Secure Login</span>
<span class="material-symbols-outlined text-sm" data-icon="login">login</span>
</button>
</div>
</form>
</div>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg flex gap-4 text-center">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Help Center</a>
<span class="text-outline-variant">•</span>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-outline-variant">•</span>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">IT Support</a>
</div>
</main>
</body></html>
